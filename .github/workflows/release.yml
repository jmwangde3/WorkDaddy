name: Release (tag → 正式资产)

# 1.3.x 唯一的正式发布入口。分两个 job：
#   build   —— 只读权限，检出指定提交，打包 + 校验 + 上传 Artifact；
#   publish —— 写权限，下载 Artifact 建 Release。build_only 时整个 job 跳过。
#
# 触发：
#   - push 形如 `1.3.1` 的 tag（不带 v 前缀，沿用 1.2.x 惯例）；
#   - 手动触发。
#
# 手动触发有两种用法：
#   build_only=true   必须给 version + commit（40 位 SHA），不需要 tag。
#                     对指定提交做完整发布预演，不建 tag、不建 Release。
#   build_only=false  必须给 tag，走正式发布路径。
#
# 旧的 build-win.yml 已降级为手动 legacy 流程，不再挂 Release，也不产出正式资产。
#
# 正式发布的闸门（顺序即执行顺序）：
#   1. 检出的 HEAD 必须等于目标提交（tag 指向的提交 / 手填的 commit）；
#   2. 版本 = DAEMON_VERSION = package.json（正式发布时版本就是 tag）；
#   3. 打包报告里 sourceCommit = 目标提交，两个 Git 退出码为 0，dirty=false；
#   4. 资产目录精确等于正式三件套 + SHA256SUMS，逐条哈希重算；
#   5. Release 已存在就停（除非显式 allow_overwrite）。
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: '正式发布：要发布的现有 tag（如 1.3.1）。build_only 时留空'
        required: false
      version:
        description: 'build_only 必填：要校验的版本号（如 1.3.1）'
        required: false
      commit:
        description: 'build_only 必填：要构建的完整 40 位 Commit SHA'
        required: false
      build_only:
        description: '只构建校验，不发布'
        type: choice
        options: ['false', 'true']
        default: 'false'
      allow_overwrite:
        description: '允许覆盖已存在的 Release'
        type: choice
        options: ['false', 'true']
        default: 'false'

# 默认只读：只有 publish job 单独提权。
permissions:
  contents: read

# 同一个目标不允许两条流水线同时跑：并发上传会留下半套资产。
concurrency:
  group: release-${{ github.event.inputs.commit || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  WD_TAG: ${{ github.event.inputs.tag || (github.event_name == 'push' && github.ref_name || '') }}
  WD_VERSION: ${{ github.event.inputs.version || (github.event_name == 'push' && github.ref_name || '') }}
  WD_COMMIT: ${{ github.event.inputs.commit }}
  WD_BUILD_ONLY: ${{ github.event.inputs.build_only || 'false' }}
  WD_ALLOW_OVERWRITE: ${{ github.event.inputs.allow_overwrite || 'false' }}

jobs:
  build:
    name: 构建与校验（只读）
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.target.outputs.version }}
      commit: ${{ steps.target.outputs.commit }}
    steps:
      - name: Checkout（tag 或指定 commit）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # build_only 用输入的 commit；正式发布用 tag。两者都不允许退回分支头。
          ref: ${{ github.event.inputs.build_only == 'true' && github.event.inputs.commit || (github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref) }}

      - name: 解析并校验目标（tag / commit）
        id: target
        shell: pwsh
        run: |
          $buildOnly = ($env:WD_BUILD_ONLY -eq 'true')
          git fetch --tags --force origin 2>$null | Out-Null
          $head = ((& git rev-parse HEAD) 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $head) { throw '拿不到检出提交（git rev-parse HEAD 失败）' }

          if ($buildOnly) {
            $want = [string]$env:WD_COMMIT
            if ($want -notmatch '^[0-9a-fA-F]{40}$') {
              throw "build_only 必须提供完整的 40 位 commit SHA，实际：'$want'"
            }
            $want = $want.ToLowerInvariant()
            if ($head.ToLowerInvariant() -ne $want) {
              throw "检出的 HEAD 不是指定提交：HEAD=$head commit=$want"
            }
            $version = [string]$env:WD_VERSION
            if (-not $version) { throw 'build_only 必须提供 version（如 1.3.1）' }
            Write-Output "mode=build-only commit=$want version=$version"
          } else {
            $tag = [string]$env:WD_TAG
            if (-not $tag) { throw '正式发布必须提供 tag（或由 tag push 触发）' }
            if ($tag -match '^v') { throw "tag 不应带 v 前缀（本项目惯例是 1.3.1 这种形式）：$tag" }
            $tagCommit = ((& git rev-list -n 1 "refs/tags/$tag") 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $tagCommit) { throw "tag 不存在或不是提交：$tag" }
            if ($head -ne $tagCommit) {
              throw "检出的 HEAD 不是 tag 指向的提交：HEAD=$head tag=$tagCommit。发布必须严格对应 tag。"
            }
            $version = $tag
            Write-Output "mode=publish tag=$tag commit=$head"
          }

          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "commit=$head" >> $env:GITHUB_OUTPUT

      - name: 版本一致性（版本 = DAEMON_VERSION = package.json）
        shell: pwsh
        run: |
          $version = '${{ steps.target.outputs.version }}'
          $m = Select-String -Path scripts\daemon.js -Pattern "const DAEMON_VERSION = '([^']+)'" | Select-Object -First 1
          if (-not $m) { throw '在 scripts/daemon.js 里找不到 DAEMON_VERSION' }
          $daemon = $m.Matches[0].Groups[1].Value
          $pkg = Get-Content -LiteralPath package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($daemon -ne $version) { throw "版本与 DAEMON_VERSION 不一致：version=$version daemon=$daemon" }
          if ($pkg.version -ne $version) { throw "版本与 package.json 不一致：version=$version package=$($pkg.version)" }
          Write-Output "版本三方一致：$version"

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.1 --allow-downgrade --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 安装失败：$LASTEXITCODE" }

      - name: 打包（便携版 + 源码包 + Setup）
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "找不到 ISCC.exe：$iscc" }
          # 每次从空目录开始：混进上一次的产物就等于发布来源不明的东西。
          $dist = Join-Path $env:GITHUB_WORKSPACE 'release\dist'
          if (Test-Path -LiteralPath $dist) { Remove-Item -LiteralPath $dist -Recurse -Force }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\installer\build-package.ps1 `
            -Version '${{ steps.target.outputs.version }}' -Setup -IsccPath $iscc `
            -Json (Join-Path $env:GITHUB_WORKSPACE 'release-report.json')
          if ($LASTEXITCODE -ne 0) { throw "打包失败：$LASTEXITCODE" }

      - name: 校验资产（来源 + 白名单 + 哈希）
        shell: pwsh
        run: |
          node tools/verify-release-assets.js --dir release\dist `
            --version '${{ steps.target.outputs.version }}' `
            --require-setup `
            --report release-report.json `
            --expected-commit '${{ steps.target.outputs.commit }}' `
            --json release-assets.json
          if ($LASTEXITCODE -ne 0) { throw "资产校验失败：$LASTEXITCODE" }

      - name: 列出产物与报告
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath release\dist -File | Select-Object Name, Length | Format-Table -AutoSize
          Get-Content -LiteralPath release-report.json -Raw -Encoding UTF8

      - name: 留档报告与产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.target.outputs.version }}
          path: |
            release/dist/*
            release-report.json
          if-no-files-found: error

  publish:
    name: 创建 Release（写权限）
    needs: build
    # build_only 时整个 job 跳过：连 contents:write 都不会持有。
    if: ${{ github.event.inputs.build_only != 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release/dist

      - name: 确认资产齐全
        shell: pwsh
        run: |
          $tag = '${{ needs.build.outputs.version }}'
          $files = @(Get-ChildItem -LiteralPath release\dist -File)
          foreach ($name in @("WorkDaddy-$tag-portable-win-x64.zip", "WorkDaddy-$tag-source.zip", "WorkDaddy-$tag-setup.exe", 'SHA256SUMS.txt')) {
            if (-not ($files.Name -contains $name)) { throw "产物里缺少 $name" }
          }
          Write-Output "产物 $($files.Count) 个"

      - name: 生成发布说明（未签名声明 + 校验方法）
        shell: pwsh
        run: |
          $tag = '${{ needs.build.outputs.version }}'
          $commit = '${{ needs.build.outputs.commit }}'
          $sums = Get-Content -LiteralPath release\dist\SHA256SUMS.txt -Raw -Encoding UTF8
          $lines = @(
            "# WorkDaddy $tag",
            "",
            "## 下载前请先看",
            "",
            "- 本安装包**未进行 Authenticode 代码签名**。Windows SmartScreen 可能提示「未知发布者」，需要点「更多信息 → 仍要运行」才能继续。",
            "- ``SHA256SUMS.txt`` 只能验证文件完整性，不能证明发布者身份。",
            "- 校验方法：``sha256sum -c SHA256SUMS.txt``；Windows 可用 ``Get-FileHash <文件> -Algorithm SHA256`` 逐条比对。",
            "",
            "## 资产与哈希",
            "",
            '```',
            $sums.Trim(),
            '```',
            "",
            "构建提交：``$commit``",
            "源码与打包脚本见同版本的 source 包；构建流程见仓库 ``.github/workflows/release.yml``。"
          )
          # 显式无 BOM：BOM 会变成 Release 正文的第一个字符。
          $notesPath = Join-Path (Get-Location) 'release-notes.md'
          [IO.File]::WriteAllText($notesPath, ($lines -join [Environment]::NewLine) + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($false)))
          Get-Content -LiteralPath $notesPath -Raw -Encoding UTF8

      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ needs.build.outputs.version }}'
          $repo = '${{ github.repository }}'
          $files = @(Get-ChildItem -LiteralPath release\dist -File | ForEach-Object FullName)

          $existing = gh release view $tag --repo $repo --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            if ('${{ github.event.inputs.allow_overwrite }}' -ne 'true') {
              throw "Release $tag 已存在。默认拒绝覆盖：重复发布会让已发出去的资产换掉内容。确认要覆盖请用 workflow_dispatch 并显式把 allow_overwrite 设为 true。"
            }
            Write-Output "Release $tag 已存在，按显式授权覆盖上传"
            gh release upload $tag @files --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "上传失败：$LASTEXITCODE" }
          } else {
            gh release create $tag @files --repo $repo --title $tag --notes-file release-notes.md --latest
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败：$LASTEXITCODE" }
          }
          Write-Output "Release: https://github.com/$repo/releases/tag/$tag"
